<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معي - معرض الأعمال</title>
    
    <!-- ربط Bootstrap CSS المحلي -->
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر والقائمة العلوية -->
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm py-3">
            <div class="container">
                <a class="navbar-brand fw-bold fs-4 text-primary" href="index.html">مجد بارغود</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainMenu">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-2">
                        <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                        <li class="nav-item"><a class="nav-link" href="blog.html">المدونة</a></li>
                        <li class="nav-item"><a class="nav-link" href="store.html">المتجر</a></li>
                        <li class="nav-item"><a class="nav-link" href="calculator.html">الحاسبة</a></li>
                        <li class="nav-item"><a class="nav-link active fw-bold" href="contact.html">تواصل معي</a></li>
                    </ul>
                    
                    <button class="btn btn-outline-primary ms-lg-3 btn-sm" id="themeBtn">الوضع الداكن</button>
                </div>
            </div>
        </nav>
    </header>

    <!-- المحتوى الرئيسي لصفحة التواصل -->
    <main class="py-5">
        <div class="container">
            
            <div class="text-center mb-5">
                <h1 class="fw-bold">تواصل معي</h1>
                <p class="text-secondary">يسعدني تواصلك معي أو إرسال استفسارك عبر النموذج أدناه.</p>
            </div>

            <!-- نموذج التواصل -->
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card shadow-sm border-0 bg-body-tertiary p-4 rounded-4">
                        <div class="card-body">
                            
                            <!-- رسالة التنبيه التفاعلية بعد الإرسال -->
                            <div class="alert alert-success d-none text-center mb-4" id="successMsg">
                                شكراً لك! تم إرسال رسالتك بنجاح وسأقوم بالرد عليك قريباً.
                            </div>

                            <form id="contactForm">
                                <!-- الاسم -->
                                <div class="mb-3">
                                    <label for="userName" class="form-label fw-bold">الاسم الكريم:</label>
                                    <input type="text" class="form-control" id="userName" placeholder="أدخل اسمك الكامل" required>
                                </div>

                                <!-- البريد الإلكتروني -->
                                <div class="mb-3">
                                    <label for="userEmail" class="form-label fw-bold">البريد الإلكتروني:</label>
                                    <input type="email" class="form-control" id="userEmail" placeholder="name@example.com" required>
                                </div>

                                <!-- رسالة النص -->
                                <div class="mb-3">
                                    <label for="userMessage" class="form-label fw-bold">نص الرسالة:</label>
                                    <textarea class="form-control" id="userMessage" rows="4" placeholder="اكتب رسالتك أو استفسارك هنا..." required></textarea>
                                </div>

                                <!-- زر الإرسال -->
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary py-2 fw-bold">إرسال الرسالة</button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- الفوتر -->
    <footer class="py-3 bg-body-tertiary border-top text-center mt-auto">
        <div class="container">
            <small class="text-secondary">جميع الحقوق محفوظة &copy; 2026</small>
        </div>
    </footer>

    <!-- ربط ملفات الجافاسكربت -->
    <script src="bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
